  ${S.members.map(m=>`<div class="row sp"><span>${esc(m.name)} <span class="mu">${m.role} · code: <b>${codeOf(m)?esc(codeOf(m)):"••••••••"}</b>${m.phone?" · "+esc(m.phone):""}</span></span><span><button class="g" onclick="setPhone('${m.id}')">Phone</button> <button class="g" onclick="renMem('${m.id}')">Rename</button> ${m.role==="admin"?"":`<button class="g" onclick="reset('${m.id}')">Reset code</button>`} ${m.id===me.id?"":`<button class="d" onclick="delMem('${m.id}')">Remove</button>`}</span></div>`).join("")}</div>`}
async function enter(m){MESS=m.mess;await loadMess();me=S.members.find(x=>x.id===m.id)||m;myCode=String(m.code||"");fails=0;await decAll();try{localStorage.setItem("mess_code",m.code)}catch(e){}tab="home";msg="";lmode=null;render()}
async function login(role){const c=$("#lc").value.trim();if(!c)return;if(Date.now()<lockUntil){msg="Too many wrong attempts. Please wait "+Math.ceil((lockUntil-Date.now())/1000)+"s.";render();return}
  try{const m=await findCode(c,true);
    if(!m){bad();msg="Wrong code";render();return}
    if(role==="admin"&&m.role!=="admin"){msg="This is a user code. Use Login as User.";render();return}
    if(role==="user"&&m.role==="admin"){msg="This is an admin code. Use Login as Admin.";render();return}
    await enter(m)}catch(e){msg="Connection problem: "+(e.message||e);render()}}
async function boot(){const n=$("#an").value.trim(),c=$("#ac").value.trim();if(!n)return;if(!codeOk(c)){msg="Admin code must be 8+ characters (letters and numbers) and not too simple.";render();return}
  try{if(await findCode(c)){msg="This code is already used. Choose another.";render();return}
    const id=uid();MESS=rid();myCode=c;S={members:[],bazar:[],config:[],log:[]};msg="";
    const m={id,name:n,role:"admin",code:c,deposits:[],meals:{}};await save("members",m);if(/^Could not/.test(msg)){render();return}await save("config",{id:"type",kind:ctype});if(/^Could not/.test(msg)){render();return}await enter(m)}catch(e){msg="Connection problem: "+(e.message||e);render()}}
function setPic(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type)){msg="Please choose an image file.";render();return}
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=128,c=document.createElement("canvas");c.width=c.height=z;const x=c.getContext("2d"),s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;x.drawImage(im,sx,sy,s,s,0,0,z,z);
    const m=S.members.find(q=>q.id===me.id);if(!m)return;m.pic=c.toDataURL("image/jpeg",.8);msg="";save("members",m)};im.onerror=()=>{msg="Could not read that image.";render()};im.src=r.result};r.readAsDataURL(f)}
function rmPic(){const m=S.members.find(q=>q.id===me.id);if(!m)return;delete m.pic;save("members",m)}
function logout(){dzOk=false;me=null;myCode="";MESS=null;S={members:[],bazar:[],config:[],log:[]};flash="";lmode=null;msg="";try{localStorage.removeItem("mess_code")}catch(e){}render()}
function tog(id,d,k){const m=S.members.find(x=>x.id===id);if(!m)return;if(me.role!=="admin"&&(id!==me.id||d!==iso()))return;if(blocked(k,d)){render();return}const v=mv(m,d);const to=v[k]?0:1;m.meals={...(m.meals||{}),[d]:{...v,[k]:to}};save("members",m).then(render);save("log",{id:uid(),t:Date.now(),by:me.name,byId:me.id,who:m.name,date:d,k,to})}
function setGuest(id,d,k,val){const m=S.members.find(x=>x.id===id);if(!m||!isG(k))return;if(me.role!=="admin"&&(id!==me.id||d!==iso()))return;if(blocked(k,d)){render();return}let n=parseInt(val,10);if(!(n>=0))n=0;if(n>30)n=30;const v=mv(m,d),from=v[k];if(n===from)return;m.meals={...(m.meals||{}),[d]:{...v,[k]:n}};save("members",m).then(render);save("log",{id:uid(),t:Date.now(),by:me.name,byId:me.id,who:m.name,date:d,k,to:n,from})}
function setClosed(k,val){if(!me||me.role!=="admin"||(k!=="b"&&k!=="l"&&k!=="d"))return;if(k==="b"&&kind()!=="bld")return;const t=iso(),all=locks(),cl={};for(const d in all)if(d>=t)cl[d]=all[d];cl[t]={...(cl[t]||{}),[k]:val?1:0};save("config",{id:"locks",closed:cl}).then(render);save("log",{id:uid(),t:Date.now(),by:me.name,byId:me.id,who:"Everyone",date:t,k:"lk_"+k,to:val?1:0})}
function setPhone(id){const m=S.members.find(x=>x.id===id);if(!m||(me.role!=="admin"&&id!==me.id))return;
  dlg({title:id===me.id?"My phone number":"Phone: "+m.name,text:"Everyone in the mess can see this number, to call in an emergency. Leave it empty to remove it.",input:m.phone||"",ok:"Save",cb:v=>{const raw=(v||"").trim();v=raw.replace(/[\s\-().]/g,"");if(raw&&!/^\+?\d{6,15}$/.test(v)){msg="Enter a valid phone number, digits only (example: 01712345678).";render();return}if(v===(m.phone||""))return;msg="";if(v)m.phone=v;else delete m.phone;save("members",m)}})}
function setKhala(){if(!me||me.role!=="admin")return;const cur=(S.config.find(x=>x.id==="khala")||{}).phone||"";
  dlg({title:"Khala's phone number",text:"Everyone will see a <b>Call Khala</b> button that calls this number. Leave it empty to remove it.",input:cur,ok:"Save",cb:v=>{const raw=(v||"").trim(),n=raw.replace(/[\s\-().]/g,"");if(raw&&!/^\+?\d{6,15}$/.test(n)){msg="Enter a valid phone number, digits only (example: 01712345678).";render();return}if(n===cur)return;msg="";save("config",{id:"khala",phone:n})}})}
function copyNum(n,b){const done=()=>{if(b){const o=b.textContent;b.textContent="Copied \u2713";setTimeout(()=>{b.textContent=o},1400)}};
  const fb=()=>{const t=document.createElement("textarea");t.value=n;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done()};
  try{navigator.clipboard.writeText(n).then(done,fb)}catch(e){fb()}}
function addDep(){const m=S.members.find(x=>x.id===$("#dm").value),a=parseFloat($("#da").value);if(!m||!(a>0))return;m.deposits=[...(m.deposits||[]),{d:iso(),a}];save("members",m)}
function delDep(id,i){const m=S.members.find(x=>x.id===id);m.deposits.splice(i,1);save("members",m)}
function addBazar(){const a=parseFloat($("#ba").value);if(!(a>0))return;save("bazar",{id:uid(),date:$("#bd").value||iso(),by:$("#bm").value,note:$("#bn").value.trim(),amt:a})}
function setDay(i,v){save("config",{id:"schedule",days:{...sched(),[i]:v}})}
async function addMem(){const n=$("#nn").value.trim(),c=$("#nc").value.trim();if(!n)return;if(!codeOk(c)){msg="Member code must be 8+ characters (letters and numbers) and not too simple.";render();return}
  try{if(await findCode(c)){msg="This code is already used by someone. Choose another.";render();return}}catch(e){msg="Connection problem: "+(e.message||e);render();return}
  await save("members",{id:uid(),name:n,role:"member",code:c,deposits:[],meals:{}});if(/^Could not/.test(msg))return;msg="";flash=`Code for <b>${esc(n)}</b>: <b>${esc(c)}</b>. Give it to the member.`;render()}
async function reset(id){const m=S.members.find(x=>x.id===id);if(!m||m.role==='admin')return;let c=gen();try{while(await findCode(c))c=gen()}catch(e){}m.code=c;delete m.h;await save("members",m);flash=`New code for <b>${esc(m.name)}</b>: <b>${c}</b>. Give it to the member.`;render()}
function delMem(id){const m=S.members.find(x=>x.id===id);if(!m||id===me.id)return;
  dlg({title:"Remove member?",text:`<b>${esc(m.name)}</b> will be removed, along with their meals and deposits.`,ok:"Remove",danger:true,cb:async()=>{
    await del("members",id);const sc={...sched()};let ch=false;for(const k in sc)if(sc[k]===id){sc[k]="";ch=true}if(ch)save("config",{id:"schedule",days:sc})}})}
function renMem(id){const m=S.members.find(x=>x.id===id);if(!m)return;
  dlg({title:"Change name",input:m.name,ok:"Save",cb:v=>{if(!v||v===m.name)return;m.name=v;save("members",m)}})}
function soft(){const a=document.activeElement;if(me&&a&&/INPUT|SELECT/.test(a.tagName)&&$("#app").contains(a))return;render()}
setInterval(()=>{const c=document.getElementById("clock");if(c)c.textContent=fmtClock()},1000);
let lastVer=null,polling=false,noVer=false;
async function poll(){if(!FB||!MESS||busy||!me||document.hidden||polling)return;polling=true;
  try{if(!noVer){try{const r=await api({op:"ver"},true);if(r.v===lastVer)return;var nv=r.v}catch(e){if(/bad op/.test(e.message||""))noVer=true;else return}}
    const b=JSON.stringify(S);await loadMess(true);if(busy)return;if(me&&!S.members.some(m=>m.id===me.id)){kicked();return}if(typeof nv!=="undefined")lastVer=nv;if(JSON.stringify(S)!==b)soft()}catch(e){}finally{polling=false}}
async function init(){render();let c=null;try{c=localStorage.getItem("mess_code")}catch(e){}
  if(c){try{const m=await findCode(c,true);if(m)await enter(m)}catch(e){}}
  setInterval(poll,4000);document.addEventListener("visibilitychange",poll);addEventListener("online",poll);addEventListener("focus",poll)}
init();
</script></body></html>
